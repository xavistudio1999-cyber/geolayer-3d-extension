<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoLayer 3D Lite</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="panel">
      <header>
        <div>
          <div class="eyebrow">After Effects</div>
          <h1>GeoLayer 3D Lite</h1>
        </div>
        <button id="liveToggle" class="primary">Start live</button>
      </header>

      <div class="grid">
        <label>
          <span>Latitude</span>
          <input id="latInput" type="number" step="0.000001" value="40.7128" />
        </label>

        <label>
          <span>Longitude</span>
          <input id="lngInput" type="number" step="0.000001" value="-74.0060" />
        </label>

        <label>
          <span>Zoom</span>
          <input id="zoomInput" type="number" min="1" max="22" value="15" />
        </label>

        <label>
          <span>Tilt</span>
          <input id="tiltInput" type="number" min="0" max="65" value="45" />
        </label>
      </div>

      <div class="row">
        <button id="applyBtn" class="secondary">Apply</button>
        <button id="exportBtn" class="primary">Send to AE</button>
      </div>

      <div class="stats">
        <div><small>Speed</small><strong id="speedValue">36 km/h</strong></div>
        <div><small>Heading</small><strong id="headingValue">87°</strong></div>
        <div><small>Altitude</small><strong id="altitudeValue">120 m</strong></div>
      </div>

      <div class="toggles">
        <label><input id="terrainToggle" type="checkbox" checked /> 3D terrain</label>
        <label><input id="satelliteToggle" type="checkbox" /> Satellite</label>
      </div>

      <div id="map"></div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&v=weekly&libraries=places"></script>
    <script src="./app.js"></script>
  </body>
</html>
